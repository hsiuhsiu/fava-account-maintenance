[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fava-account-maintenance"
version = "0.2.0"
description = "A Fava extension for auditing Beancount account lifecycle and history boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fava>=1.30.12,<1.31",
]

[project.urls]
Homepage = "https://github.com/hsiuhsiu/fava-account-maintenance"
Repository = "https://github.com/hsiuhsiu/fava-account-maintenance.git"
Issues = "https://github.com/hsiuhsiu/fava-account-maintenance/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fava_account_maintenance = [
  "UpdateGuidance.js",
  "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
